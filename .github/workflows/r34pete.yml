name: R34pete (bot online)

# El bot corre dentro de un workflow: los runners gratuitos de GitHub son
# ilimitados en repositorios publicos y no hacen falta tarjetas ni cuentas.
# Cada ejecucion aguanta hasta 6 h (limite de Actions) y el cron la relanza.

on:
  schedule:
    # Cada 5 h; cada sesion dura 5 h 20 min, asi que hay solapamiento minimo.
    - cron: "3,8,13,18,23 * * * *"
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos que debe correr esta sesion"
        default: "300"

concurrency:
  group: r34pete-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      # ¿Hay que bajar la libreria nativa del Social SDK? (no es un secreto,
      # solo una bandera: el secreto va en el paso que la descarga).
      SOCIAL_SDK_ACTIVO: ${{ secrets.SOCIAL_SDK_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --omit=dev

      - name: Preparar configuracion
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          RULE34_USER_ID: ${{ secrets.RULE34_USER_ID }}
          RULE34_API_KEY: ${{ secrets.RULE34_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HORDE_API_KEY: ${{ secrets.HORDE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          mkdir -p .r34pete
          cp config.github.json .r34pete/config.json
          node -e '
            const fs = require("fs");
            const p = ".r34pete/config.json";
            const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
            cfg.token = process.env.DISCORD_TOKEN;
            cfg.feedsFile = ".r34pete/feeds.json";
            cfg.vistosFile = ".r34pete/vistos.json";
            cfg.pendientesFile = ".r34pete/pendientes.json";
            cfg.chat.instrucciones = ".r34pete/instrucciones.md";
            cfg.conocimientoFile = ".r34pete/respuestas.json";
            cfg.social = cfg.social || {};
            cfg.social.archivo = ".r34pete/borradores.json";
            cfg.social.appId = process.env.DISCORD_SOCIAL_APP_ID || "";
            cfg.providers.rule34.userId = process.env.RULE34_USER_ID || cfg.providers.rule34.userId;
            cfg.providers.rule34.apiKey = process.env.RULE34_API_KEY || "";
            cfg.providers.rule34.enabled = Boolean(cfg.providers.rule34.apiKey);
            cfg.ia = cfg.ia || {};
            cfg.ia.claves = cfg.ia.claves || {};
            cfg.ia.claves.openrouter = process.env.OPENROUTER_API_KEY || cfg.ia.claves.openrouter || "";
            cfg.ia.claves.gemini = process.env.GEMINI_API_KEY || cfg.ia.claves.gemini || "";
            cfg.ia.claves.groq = process.env.GROQ_API_KEY || cfg.ia.claves.groq || "";
            cfg.ia.claves.cerebras = process.env.CEREBRAS_API_KEY || cfg.ia.claves.cerebras || "";
            cfg.ia.claves.nvidia = process.env.NVIDIA_API_KEY || cfg.ia.claves.nvidia || "";
            cfg.ia.claves.mistral = process.env.MISTRAL_API_KEY || cfg.ia.claves.mistral || "";
            cfg.ia.claves.cloudflare = process.env.CLOUDFLARE_API_KEY || cfg.ia.claves.cloudflare || "";
            cfg.ia.claves.cloudflare_account = process.env.CLOUDFLARE_ACCOUNT_ID || cfg.ia.claves.cloudflare_account || "";
            cfg.ia.claves.horde = process.env.HORDE_API_KEY || cfg.ia.claves.horde || "";
            cfg.ia.claves.xai = process.env.XAI_API_KEY || cfg.ia.claves.xai || "";
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2));
          '
          chmod 600 .r34pete/config.json
          cp instrucciones.md .r34pete/instrucciones.md
          cp respuestas.json .r34pete/respuestas.json
          # Semilla del registro de "ya publicado" (evita repetir al reiniciar).
          if [ -f vistos.json ]; then cp vistos.json .r34pete/vistos.json; fi
          echo "token: $([ -n "$DISCORD_TOKEN" ] && echo puesto || echo FALTA)"
          echo "rule34: $([ -n "$RULE34_API_KEY" ] && echo con clave || echo sin clave)"
          echo "openrouter: $([ -n "$OPENROUTER_API_KEY" ] && echo con clave || echo SIN clave)"
          echo "modelo openrouter: $(node -e 'console.log(JSON.parse(require("fs").readFileSync(".r34pete/config.json","utf8")).ia.openrouter_modelo)')"

      # Comprobacion real del backend de IA: llama a OpenRouter con la clave de
      # la instancia y escribe en el log el modelo que sirvio de verdad.
      - name: Probar el backend openrouter
        env:
          R34PETE_CONFIG: .r34pete/config.json
        run: |
          node probar-ia-openrouter.js || echo "aviso: el backend openrouter no respondio (el bot seguira con el siguiente)"

      - name: Probar los backends de IA
        env:
          R34PETE_CONFIG: .r34pete/config.json
        run: |
          node probar-ia.js || echo "aviso: ningun backend respondio (el bot seguira con el siguiente)"

      - name: Bajar la libreria del Social SDK
        if: env.SOCIAL_SDK_ACTIVO == 'true'
        env:
          SOCIAL_SDK_URL: ${{ secrets.SOCIAL_SDK_URL }}
          SOCIAL_SDK_TOKEN: ${{ secrets.SOCIAL_SDK_TOKEN }}
        run: |
          mkdir -p .r34pete/sdk
          if [ -n "$SOCIAL_SDK_TOKEN" ]; then
            curl -fsSL -H "Authorization: Bearer $SOCIAL_SDK_TOKEN" "$SOCIAL_SDK_URL" -o .r34pete/sdk/libdiscord_partner_sdk.so
          else
            curl -fsSL "$SOCIAL_SDK_URL" -o .r34pete/sdk/libdiscord_partner_sdk.so
          fi
          chmod 644 .r34pete/sdk/libdiscord_partner_sdk.so
          echo "libreria del SDK descargada ($(stat -c %s .r34pete/sdk/libdiscord_partner_sdk.so) bytes)"

      - name: Hablar con Discord
        env:
          R34PETE_CONFIG: .r34pete/config.json
          R34PETE_INSTRUCCIONES: .r34pete/instrucciones.md
          MINUTOS: ${{ inputs.minutos || '300' }}
          # Social SDK (bandeja de privados de Yuki). Si no hay nada de esto,
          # el bot funciona igual y solo se apaga esa parte.
          DISCORD_SOCIAL_APP_ID: ${{ secrets.DISCORD_SOCIAL_APP_ID }}
          DISCORD_SOCIAL_ACCESS: ${{ secrets.DISCORD_SOCIAL_ACCESS }}
          DISCORD_SOCIAL_REFRESH: ${{ secrets.DISCORD_SOCIAL_REFRESH }}
          DISCORD_SOCIAL_EXPIRES: ${{ secrets.DISCORD_SOCIAL_EXPIRES }}
          DISCORD_SOCIAL_SCOPES: ${{ secrets.DISCORD_SOCIAL_SCOPES }}
          DISCORD_SDK_PATH: ${{ github.workspace }}/.r34pete/sdk
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_DUENO: ${{ secrets.TELEGRAM_CHAT_DUENO }}
        run: |
          timeout --signal=TERM "${MINUTOS}m" node src/index.js &
          PID=$!
          trap "kill $PID" SIGTERM
          echo "bot arrancado (pid $PID), escuchando Discord..."
          # La sesion dura lo que diga el input "minutos" (300 por defecto).
          # Cada 10 min guarda el registro de vistos en el repo, para que la
          # proxima sesion no repita lo ya publicado.
          while kill -0 $PID 2>/dev/null; do
            sleep 20
            if [ -f .r34pete/vistos.json ] || [ -f .r34pete/pendientes.json ]; then
              git config user.name "r34pete"
              git config user.email "r34pete@users.noreply.github.com"
              git add --ignore-unmatch .r34pete/vistos.json .r34pete/pendientes.json || true
              git diff --cached --quiet || git commit -q -m "registro de publicados" || true
              # main puede haber avanzado (cambios del repo): se rebasa antes de
              # subir; si el rebase no sale, se aborta y se salta este ciclo.
              git fetch -q origin main || true
              git rebase origin/main >/dev/null 2>&1 || git rebase --abort >/dev/null 2>&1 || true
              git push -q origin HEAD:main || true
            fi
          done
          wait $PID || echo "el bot salio con codigo $?"
